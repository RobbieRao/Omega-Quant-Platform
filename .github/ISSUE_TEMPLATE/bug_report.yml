name: Bug report
description: Report a reproducible defect using synthetic or redacted data.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Do not include credentials, account IDs, or real portfolio data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, account identifiers, and private financial data.
          required: true
